name: Release

# Run by pushing a version tag that points at a commit on the `release` branch:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag must be on the release branch
        run: |
          git fetch origin release
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/release; then
            echo "::error::$GITHUB_REF_NAME is not on the release branch. Promote dev to release first."
            exit 1
          fi

      - name: Signing password must exist
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Repository secret KEYSTORE_PASSWORD is not set. See docs/RELEASING.md."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decrypt keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # The encrypted key lives on the release branch, so a tag cut before it was added still finds it.
          if ! git show origin/release:signing/release.p12.enc > "$RUNNER_TEMP/release.p12.enc"; then
            echo "::error::signing/release.p12.enc is missing on release. Run the 'Generate signing key' workflow."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 \
            -in "$RUNNER_TEMP/release.p12.enc" -out "$RUNNER_TEMP/release.p12" -pass env:KEYSTORE_PASSWORD

      - name: Test and build signed APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: serverwatcher
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon testDebugUnitTest assembleRelease \
            -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"

      - name: Verify signature and name the artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ServerWatcher-$VERSION.apk"
          (cd dist && sha256sum "ServerWatcher-$VERSION.apk" > "ServerWatcher-$VERSION.apk.sha256")
          cat "dist/ServerWatcher-$VERSION.apk.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PRERELEASE=""
          case "$VERSION" in 0.*|*-*) PRERELEASE="--prerelease" ;; esac
          FILES=("dist/ServerWatcher-$VERSION.apk" "dist/ServerWatcher-$VERSION.apk.sha256")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A release was already drafted for this tag in the GitHub UI: attach the files to it.
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --title "ServerWatcher $VERSION" --generate-notes $PRERELEASE
          fi

      - name: Keep the latest APK on the release branch
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r dist "$RUNNER_TEMP/dist"
          git checkout -B release origin/release
          mkdir -p apk
          cp "$RUNNER_TEMP/dist/ServerWatcher-$VERSION.apk" apk/ServerWatcher-latest.apk
          (cd apk && sha256sum ServerWatcher-latest.apk > ServerWatcher-latest.apk.sha256)
          git add apk
          git commit -m "Add ServerWatcher $VERSION APK"
          git push origin release
