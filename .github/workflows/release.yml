name: Release

# Builds the signed APK whenever `release` receives a push (normally a merged PR) that bumps the
# `VERSION` file, and stores it as apk/ServerWatcher-latest.apk on `release`.
on:
  push:
    branches: [release]
    # The build's own commits and non-code changes never need a new APK.
    paths-ignore:
      - "apk/**"
      - "signing/**"
      - "docs/**"
      - "**.md"
      - "LICENSE"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version and make sure it is new
        run: |
          git fetch origin release
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must look like 1.2.3, found '$VERSION'."
            exit 1
          fi
          BUILT="$(git show origin/release:apk/VERSION 2>/dev/null | tr -d '[:space:]' || true)"
          if [ "$BUILT" = "$VERSION" ]; then
            echo "::error::Version $VERSION is already built. Bump the VERSION file in your PR to publish a new APK."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Signing password must exist
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Repository secret KEYSTORE_PASSWORD is not set. See docs/RELEASING.md."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decrypt keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if ! git show origin/release:signing/release.p12.enc > "$RUNNER_TEMP/release.p12.enc"; then
            echo "::error::signing/release.p12.enc is missing on release. Run the 'Generate signing key' workflow."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 \
            -in "$RUNNER_TEMP/release.p12.enc" -out "$RUNNER_TEMP/release.p12" -pass env:KEYSTORE_PASSWORD

      - name: Test and build signed APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: serverwatcher
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleRelease \
            -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"

      - name: Verify the signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p "$RUNNER_TEMP/dist"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/dist/ServerWatcher-latest.apk"

      - name: Store the APK on the release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin release
          git checkout -B release origin/release
          mkdir -p apk
          cp "$RUNNER_TEMP/dist/ServerWatcher-latest.apk" apk/ServerWatcher-latest.apk
          (cd apk && sha256sum ServerWatcher-latest.apk > ServerWatcher-latest.apk.sha256)
          echo "$VERSION" > apk/VERSION
          cat apk/ServerWatcher-latest.apk.sha256
          git add apk
          git commit -m "Add ServerWatcher $VERSION APK"
          git push origin release
